[package]
name = "viralflow"
version = "1.1.0"
description = "ViralFlow - local video editor"
license = "GPL-3.0-only"
repository = "https://github.com/ivall/viralflow"
edition = "2021"
rust-version = "1.80"

[lib]
name = "viralflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
tiny-skia = "0.11"
rayon = "1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "http2"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
fontdb = "0.23"
ttf-parser = "0.25"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true

[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.tiny-skia]
opt-level = 3
