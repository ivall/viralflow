# Checks on every push to main and on pull requests: formatting, clippy and
# the tests of the whole workspace on Windows, Linux and macOS. Builds no
# installers (see release.yml).
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The FFmpeg version every platform builds and tests against.
  FFMPEG_WINDOWS: https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-full_build-shared.7z

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    env:
      # LLVM is preinstalled on the runner; libclang generates the libav bindings.
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v7

      # FFmpeg 8 "shared" build (headers, import libraries and DLLs).
      - name: FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest $env:FFMPEG_WINDOWS -OutFile ffmpeg.7z
          7z x ffmpeg.7z -offmpeg-download | Out-Null
          $dir = (Get-ChildItem ffmpeg-download -Directory | Select-Object -First 1).FullName
          "FFMPEG_DIR=$dir" | Out-File -Append $env:GITHUB_ENV
          "$dir\bin" | Out-File -Append $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Media tests make their fixtures with the ffmpeg command line (on PATH above).
      - name: Tests
        run: cargo test --workspace

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # mesa-vulkan-drivers: lavapipe, a software Vulkan GPU for the rendering and UI tests.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev cmake g++ pkg-config libxkbcommon-dev libfontconfig1-dev libasound2-dev libdbus-1-dev libwayland-dev mesa-vulkan-drivers

      - name: FFmpeg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/ci/ffmpeg-linux.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # The runner's formula list is not updated by itself, and ffmpeg@8 is newer than it.
      - name: FFmpeg
        run: |
          brew update --quiet
          brew install ffmpeg@8 pkg-config cmake
          prefix="$(brew --prefix ffmpeg@8)"
          "$prefix/bin/ffmpeg" -hide_banner -version | head -n 1
          echo "FFMPEG_DIR=$prefix" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(bash scripts/libclang-path.sh)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
