# Fast checks on every push to main and on pull requests. Builds no installers.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**.md', 'LICENSE', '.github/ISSUE_TEMPLATE/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! expects the frontend folder to exist.
      - name: Placeholder frontend
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>ci</title>' > dist/index.html

      - name: Formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # The export test renders a real video when FFmpeg is installed (Linux runner)
      # and is skipped otherwise.
      - name: Tests
        working-directory: src-tauri
        run: cargo test
